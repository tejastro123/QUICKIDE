version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: quickide-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - quickide-network

  redis:
    image: redis:7-alpine
    container_name: quickide-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quickide-network

  compiler:
    build:
      context: .
      dockerfile: compiler_api/Dockerfile
    container_name: quickide-compiler
    ports:
      - "5001:5001"
    volumes:
      - compiler_cache:/app/compiler_api/cache
    networks:
      - quickide-network
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quickide-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/quickide
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=9f4a2e1d8c7b6a5f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0
      - ENCRYPTION_KEY=3c7f2a9d1e4b8f6c5a2d0e7b3f1c9a4d
      - PYTHON_API_URL=http://compiler:5001
      - PORT=5000
    depends_on:
      - mongodb
      - redis
      - compiler
    networks:
      - quickide-network
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: quickide-client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - quickide-network
    restart: always

volumes:
  mongodb_data:
  redis_data:
  compiler_cache:

networks:
  quickide-network:
    driver: bridge
